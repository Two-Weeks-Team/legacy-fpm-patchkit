name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  advisory-sync:
    name: Advisory batch / Worker runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: automation/advisory-sync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: automation/advisory-sync/package-lock.json
      - run: npm ci
      - run: npm run seed
      - name: Generated reviewed seed must be current
        run: git diff --exit-code -- src/seed.ts
      - run: npx wrangler types --include-runtime=false --include-main-module=false --check
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high

  unit:
    name: Unit / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -v
      - run: python3 -m patchkit verify
      - run: python3 scripts/check-coverage.py
      - run: python3 scripts/render-coverage.py --check
      - run: python3 scripts/check-public.py
      - run: bash -n scripts/build.sh

  native:
    name: Fresh source / portable Linux FPM
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install isolated runner build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake bison re2c pkg-config dpkg-dev libtool binutils
      - run: python3 -m patchkit fetch
      - run: python3 -m patchkit prepare
      - run: python3 scripts/check-coverage.py --source .work/source
      - name: Build without system installation
        run: bash scripts/build.sh .work/source .work/build portable
      - name: Real private-socket FPM regression
        run: python3 scripts/native-check.py --fpm .work/build/php-fpm --cli .work/build/php --output .work/native-result.json
      - name: Nonexecuting inspection and synthetic rollback
        run: |
          python3 -m patchkit inspect --binary .work/build/php-fpm --build-record .work/build/build.json
          python3 -m patchkit rehearse --candidate .work/build/php-fpm --output .work/recovery-drill
      - name: Preserve logs and evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-build-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .work/*.preparation.json
            .work/native-result.json
            .work/build/build.json
            .work/build/*.log
            .work/build/toolchain.txt
            .work/build/configure-arguments.txt
            .work/build/elf-*.txt
            .work/build/libraries.txt
            .work/build/SHA256SUMS
