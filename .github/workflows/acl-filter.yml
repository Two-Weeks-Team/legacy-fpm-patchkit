name: ACL and filter / paired Linux FPM
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-native:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # same pinned checkout as Checks
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # same pinned Python as Checks
        with:
          python-version: '3.12'
      - name: Install tools only on this ephemeral hosted runner
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake bison re2c pkg-config dpkg-dev libtool binutils valgrind
      - name: Unit and frozen historical inputs
        run: |
          python3 -B -m unittest discover -v
          python3 -B -m patchkit verify
          bash -n scripts/build.sh
      - name: Acquire pinned public archives
        run: python3 -B -m patchkit fetch
      - name: Prepare both full trees with distinct pinned identities
        run: |
          python3 -B -m patchkit prepare --output .work/source-baseline
          python3 -B -m patchkit prepare --variant acl-filter-20261114 --output .work/source-candidate
          python3 -B scripts/check-build-source.py .work/source-baseline
          python3 -B scripts/check-build-source.py .work/source-candidate --variant acl-filter-20261114
      - name: Build both with the existing portable profile and one toolchain
        run: |
          bash scripts/build.sh .work/source-baseline .work/build-baseline portable
          bash scripts/build.sh .work/source-candidate .work/build-candidate portable acl-filter-20261114
      - name: Actual paired A1-A5, CLI/FPM bytes, PHPT, memcheck, and 36-check regressions
        run: |
          python3 -B scripts/advisory-check.py \
            --baseline-cli .work/build-baseline/php --baseline-fpm .work/build-baseline/php-fpm \
            --baseline-source .work/source-baseline \
            --candidate-cli .work/build-candidate/php --candidate-fpm .work/build-candidate/php-fpm \
            --candidate-source .work/source-candidate \
            --output .work/advisory-result --timeout 900
      - name: Preserve raw evidence even for setup/build/runtime/cleanup failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # same pinned uploader as Checks
        with:
          name: acl-filter-paired-native
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .work/source-*.preparation.*
            .work/source-*.failed-preparation.log
            .work/build-*/php
            .work/build-*/php-fpm
            .work/build-*/build.json
            .work/build-*/json-generation*.json
            .work/build-*/source-identity.json
            .work/build-*/*.log
            .work/build-*/toolchain.txt
            .work/build-*/configure-arguments.txt
            .work/build-*/objects/main/php_config.h
            .work/build-*/elf-*.txt
            .work/build-*/libraries.txt
            .work/build-*/SHA256SUMS
            .work/advisory-result/
